<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GSEB ધોરણ 10 સંસ્કૃત - સંસ્કૃત સાધના</title>
  <meta name="description" content="GSEB ધોરણ 10 સંસ્કૃત વ્યાકરણ, પદ્ય, ગદ્ય, શોર્ટકટ ટ્રીક્સ, કોષ્ટકો, અનુવાદ અને બોર્ડ IMP પ્રશ્નો.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #161f36;
      --card-hover: #1e2b4a;
      --card-border: #243256;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-gold: #fbbf24;
      --accent-gold-glow: rgba(251, 191, 36, 0.25);
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --app-font: 'Noto Sans Gujarati', 'Mukta', sans-serif;
      --sanskrit-font: 'Noto Sans Devanagari', 'Mukta', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--app-font);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.6;
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #0b1122;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Sticky Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 17, 34, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .back-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .back-btn:hover {
      background: #334155;
      border-color: var(--accent-gold);
    }

    .header-title-box {
      min-width: 0;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .header-subtitle {
      font-size: 11px;
      color: var(--accent-gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: #161f36;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* Content Area */
    .app-main {
      flex: 1;
      padding: 14px;
      padding-bottom: 70px;
    }

    /* Category Nav Tabs */
    .category-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
    }

    .cat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .cat-btn.active {
      background: var(--card-bg);
      color: var(--accent-gold);
      border: 1px solid rgba(251, 191, 36, 0.3);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Search Bar */
    .search-box {
      margin-bottom: 14px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 9px 12px 9px 36px;
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Card Grid */
    .item-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .item-card:hover, .item-card:active {
      background: var(--card-hover);
      border-color: rgba(251, 191, 36, 0.4);
      transform: translateY(-1px);
    }

    .item-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .item-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.25);
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .item-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sanskrit {
      font-family: var(--sanskrit-font);
      color: var(--accent-gold);
      font-size: 13px;
    }

    .item-desc {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-arrow {
      color: var(--accent-gold);
      font-size: 16px;
      flex-shrink: 0;
    }

    /* Sub Tabs inside Detail View */
    .sub-tabs-container {
      position: sticky;
      top: 53px;
      z-index: 40;
      background: var(--bg-dark);
      padding: 8px 0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .sub-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px;
    }

    .sub-tabs::-webkit-scrollbar {
      display: none;
    }

    .sub-tab-btn {
      flex: 1;
      min-width: 90px;
      white-space: nowrap;
      background: #111a30;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .sub-tab-btn.active {
      background: rgba(251, 191, 36, 0.15);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* Detail View Blocks */
    .content-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .box-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Sanskrit Text Block */
    .shloka-block {
      background: #0f1629;
      border-left: 3px solid var(--accent-gold);
      padding: 12px 14px;
      border-radius: 0 10px 10px 0;
      margin-bottom: 12px;
    }

    .sanskrit-text {
      font-family: var(--sanskrit-font);
      font-size: 16px;
      font-weight: 600;
      color: #fef08a;
      line-height: 1.8;
      margin-bottom: 8px;
    }

    .gujarati-trans {
      font-size: 13px;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 2px solid var(--accent-cyan);
    }

    .shloka-num {
      display: inline-block;
      font-size: 11px;
      background: rgba(251, 191, 36, 0.2);
      color: var(--accent-gold);
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    /* Suffix Highlight in Tables (Neon Gold) */
    .suffix-hl {
      color: #fffb00 !important;
      background: rgba(251, 191, 36, 0.28) !important;
      border: 1px solid #fbbf24 !important;
      font-weight: 800 !important;
      padding: 2px 5px !important;
      border-radius: 5px !important;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.7) !important;
      display: inline-block;
      margin: 1px;
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    table.sanskrit-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: center;
      background: #0d1426;
    }

    table.sanskrit-table th {
      background: #18233e;
      color: var(--accent-cyan);
      font-weight: 700;
      padding: 8px 6px;
      border: 1px solid var(--card-border);
      font-size: 11.5px;
    }

    table.sanskrit-table td {
      padding: 8px 6px;
      border: 1px solid var(--card-border);
      font-family: var(--sanskrit-font);
      color: #e2e8f0;
      font-size: 13px;
    }

    table.sanskrit-table tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Rules & Tricks */
    .trick-card {
      background: linear-gradient(145deg, #131d33, #0f172a);
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .trick-title {
      color: var(--accent-gold);
      font-weight: 700;
      font-size: 13.5px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .trick-badge {
      background: #fbbf24;
      color: #0b1122;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .trick-desc {
      font-size: 12.5px;
      color: #cbd5e1;
    }

    .trick-formula {
      background: #090e1a;
      border-left: 3px solid #10b981;
      padding: 6px 10px;
      margin-top: 6px;
      font-family: var(--sanskrit-font);
      font-size: 13px;
      color: #a7f3d0;
      border-radius: 0 6px 6px 0;
    }

    /* Glossary Table */
    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      gap: 12px;
    }

    .word-sanskrit {
      font-family: var(--sanskrit-font);
      font-weight: 700;
      color: var(--accent-gold);
      font-size: 14px;
    }

    .word-meaning {
      font-size: 13px;
      color: #e2e8f0;
      text-align: right;
    }

    /* IMP Questions */
    .imp-card {
      background: #111a30;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .imp-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .imp-tag {
      background: rgba(244, 63, 94, 0.2);
      color: #fb7185;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .imp-year {
      color: var(--text-muted);
    }

    .imp-q {
      font-weight: 700;
      font-size: 13.5px;
      color: #fff;
      margin-bottom: 6px;
    }

    .imp-ans {
      font-size: 12.5px;
      color: #94a3b8;
      background: #0c1222;
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 2px solid var(--accent-emerald);
    }

    /* MCQ Quiz Section */
    .quiz-card {
      background: #121c33;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .quiz-q {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quiz-opt-btn {
      background: #0d1426;
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quiz-opt-btn:hover {
      border-color: var(--accent-cyan);
    }

    .quiz-opt-btn.correct {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: #10b981 !important;
      color: #6ee7b7 !important;
      font-weight: 700;
    }

    .quiz-opt-btn.wrong {
      background: rgba(244, 63, 94, 0.2) !important;
      border-color: #f43f5e !important;
      color: #fda4af !important;
    }

    .quiz-feedback {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }

    .quiz-feedback.show {
      display: block;
    }

    .quiz-tools {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .btn-secondary {
      flex: 1;
      background: #1e293b;
      color: var(--accent-gold);
      border: 1px solid #334155;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #161f36;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .form-group input, .form-group select {
      width: 100%;
      background: #0d1426;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    /* Font size scaling */
    .font-lg .sanskrit-text { font-size: 19px; }
    .font-lg .gujarati-trans { font-size: 14.5px; }
    .font-lg table.sanskrit-table td { font-size: 14.5px; }
    /* Table Switcher Chips */
    .table-selector-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      margin: 10px 0 14px 0;
      padding: 2px;
    }
    .table-selector-nav::-webkit-scrollbar {
      display: none;
    }
    .table-selector-chip {
      background: #0d1426;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: inherit;
    }
    .table-selector-chip:hover {
      border-color: var(--accent-gold);
      color: #fff;
    }
    .table-selector-chip.active {
      background: rgba(251, 191, 36, 0.2);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.25);
    }
  </style>
</head>
<body>
  <div class="app-viewport" id="appViewport">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <button id="backBtn" class="back-btn hidden" onclick="goHome()">
          <span>←</span> પાછા જાઓ
        </button>
        <div class="header-title-box">
          <span class="header-title" id="headerTitle">સંસ્કૃત સાધના</span>
          <span class="header-subtitle" id="headerSubtitle">GSEB ધોરણ 10 અભ્યાસક્રમ</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleFontSize()" title="ફોન્ટ સાઈઝ">A±</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main" id="mainContent">
      <!-- HOME VIEW -->
      <section id="homeView">
        <!-- 3 Category Tabs -->
        <nav class="category-nav">
          <button class="cat-btn active" id="tabVyakarana" onclick="switchCategory('vyakarana')">વ્યાકરણ</button>
          <button class="cat-btn" id="tabPadya" onclick="switchCategory('padya')">પદ્ય (કાવ્યો)</button>
          <button class="cat-btn" id="tabGadya" onclick="switchCategory('gadya')">ગદ્ય & નાટ્ય</button>
        </nav>

        <!-- Search Bar -->
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="પ્રકરણ અથવા વ્યાકરણ ટોપિક શોધો..." oninput="handleSearch()">
        </div>

        <!-- Items List -->
        <div id="itemsContainer" class="item-grid">
          <!-- Dynamic rendering -->
        </div>

        <!-- App Footer with Live Link -->
        <footer style="margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--card-border); text-align: center; font-size: 11.5px; color: var(--text-muted);">
          <div>GSEB ધોરણ 10 સંસ્કૃત સાધના • બોર્ડ પરીક્ષા વિશેષ</div>
          <div style="margin-top: 4px;">
            <a href="https://rahulk2011.github.io/Sanskrit-std-10-/" target="_blank" rel="noopener noreferrer" style="color: var(--accent-gold); text-decoration: none; font-weight: 600;">
              🌐 rahulk2011.github.io/Sanskrit-std-10-
            </a>
          </div>
        </footer>
      </section>

      <!-- DETAIL VIEW -->
      <section id="detailView" class="hidden">
        <!-- Sub Tabs Container -->
        <div class="sub-tabs-container">
          <div class="sub-tabs" id="subTabsBar">
            <!-- Dynamic sub tabs -->
          </div>
        </div>

        <!-- Tab Content Area -->
        <div id="tabContentArea">

    // UI CONTROLLER FUNCTIONS
    window.addEventListener('DOMContentLoaded', () => {
      renderHomeList();
    });

    function switchCategory(cat) {
      APP_STATE.currentCategory = cat;
      document.getElementById('tabVyakarana').classList.toggle('active', cat === 'vyakarana');
      document.getElementById('tabPadya').classList.toggle('active', cat === 'padya');
      document.getElementById('tabGadya').classList.toggle('active', cat === 'gadya');
      renderHomeList();
    }

    function goHome() {
      APP_STATE.activeItem = null;
      document.getElementById('homeView').classList.remove('hidden');
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('headerTitle').textContent = 'સંસ્કૃત સાધના';
      document.getElementById('headerSubtitle').textContent = 'GSEB ધોરણ 10 અભ્યાસક્રમ';
    }

    function openDetail(id, type) {
      APP_STATE.activeSubTab = 0;
      APP_STATE.activeTableIndex = 0;
      if (type === 'vyakarana') {
        const item = GRAMMAR_TOPICS.find(g => g.id === id);
        if (!item) return;
        APP_STATE.activeItem = { ...item, type: 'vyakarana' };
        renderGrammarDetail();
      } else {
        const list = type === 'padya' ? PADYA_CHAPTERS : GADYA_CHAPTERS;
        const item = list.find(c => c.chNum === id);
        if (!item) return;
        APP_STATE.activeItem = { ...item, type };
        renderLiteratureDetail();
      }

      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      document.getElementById('headerTitle').textContent = APP_STATE.activeItem.title;
      document.getElementById('headerSubtitle').textContent = APP_STATE.activeItem.sanskrit;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderHomeList() {
      const container = document.getElementById('itemsContainer');
      const q = APP_STATE.searchQuery.toLowerCase().trim();
      let html = '';

      if (APP_STATE.currentCategory === 'vyakarana') {
        const items = GRAMMAR_TOPICS.filter(g => 
          !q || g.title.toLowerCase().includes(q) || g.sanskrit.includes(q) || g.desc.toLowerCase().includes(q)
        );
        if (items.length === 0) {
          html = '<div style="text-align:center; padding:30px; color:#94a3b8;">કોઈ વ્યાકરણ ટોપિક મળ્યો નથી.</div>';
        } else {
          items.forEach((item, index) => {
            html += `
              <div class="item-card" onclick="openDetail('${item.id}', 'vyakarana')">
                <div class="item-card-left">
                  <div class="item-badge">${index + 1}</div>
                  <div style="min-width:0;">
                    <div class="item-title">${item.title}</div>
                    <div class="item-sanskrit">${item.sanskrit}</div>
                    <div class="item-desc">${item.desc}</div>
                  </div>
                </div>
                <div class="item-arrow">➔</div>
              </div>
            `;
          });
        }
      } else if (APP_STATE.currentCategory === 'padya') {
        const items = PADYA_CHAPTERS.filter(c => 
          !q || c.title.toLowerCase().includes(q) || c.sanskrit.includes(q) || c.intro.toLowerCase().includes(q)
        );
        if (items.length === 0) {
          html = '<div style="text-align:center; padding:30px; color:#94a3b8;">કોઈ પદ્ય મળ્યું નથી.</div>';
        } else {
          items.forEach(c => {
            html += `
              <div class="item-card" onclick="openDetail(${c.chNum}, 'padya')">
                <div class="item-card-left">
                  <div class="item-badge" style="color:#38bdf8; background:rgba(56, 189, 248, 0.12); border-color:rgba(56, 189, 248, 0.25);">Ch ${c.chNum}</div>
                  <div style="min-width:0;">
                    <div class="item-title">${c.title}</div>
                    <div class="item-sanskrit">${c.sanskrit}</div>
                    <div class="item-desc">શ્લોકો, અન્વય, શબ્દાર્થ અને બોર્ડ IMP</div>
                  </div>
                </div>
                <div class="item-arrow">➔</div>
              </div>
            `;
          });
        }
      } else {
        const items = GADYA_CHAPTERS.filter(c => 
          !q || c.title.toLowerCase().includes(q) || c.sanskrit.includes(q) || c.intro.toLowerCase().includes(q)
        );
        if (items.length === 0) {
          html = '<div style="text-align:center; padding:30px; color:#94a3b8;">કોઈ પાઠ કે નાટ્ય મળ્યું નથી.</div>';
        } else {
          items.forEach(c => {
            html += `
              <div class="item-card" onclick="openDetail(${c.chNum}, 'gadya')">
                <div class="item-card-left">
                  <div class="item-badge" style="color:#10b981; background:rgba(16, 185, 129, 0.12); border-color:rgba(16, 185, 129, 0.25);">Ch ${c.chNum}</div>
                  <div style="min-width:0;">
                    <div class="item-title">${c.title}</div>
                    <div class="item-sanskrit">${c.sanskrit}</div>
                    <div class="item-desc">ગદ્યખંડ, સરળ કથાસાર, અનુવાદ અને પ્રશ્નોત્તરી</div>
                  </div>
                </div>
                <div class="item-arrow">➔</div>
              </div>
            `;
          });
        }
      }

      container.innerHTML = html;
    }

    function handleSearch() {
      APP_STATE.searchQuery = document.getElementById('searchInput').value;
      renderHomeList();
    }

    function setSubTab(index) {
      APP_STATE.activeSubTab = index;
      const tabs = document.querySelectorAll('.sub-tab-btn');
      tabs.forEach((t, i) => t.classList.toggle('active', i === index));

      if (APP_STATE.activeItem.type === 'vyakarana') {
        renderGrammarContent();
      } else {
        renderLiteratureContent();
      }
    }

    function renderGrammarDetail() {
      const subTabsBar = document.getElementById('subTabsBar');
      const tabs = ['શોર્ટકટ ટ્રીક', 'કોષ્ટકો (પ્રત્યયો)', 'ઉદાહરણો', 'MCQ ટેસ્ટ'];
      subTabsBar.innerHTML = tabs.map((tab, idx) => `
        <button class="sub-tab-btn ${idx === APP_STATE.activeSubTab ? 'active' : ''}" onclick="setSubTab(${idx})">${tab}</button>
      `).join('');

      renderGrammarContent();
    }

    function switchTableIndex(idx) {
      APP_STATE.activeTableIndex = idx;
      renderGrammarContent();
    }

      APP_STATE.activeQuizMcqs = allMcqs;

      let html = `
        <div class="content-box">
          <div class="quiz-tools">
            <button class="btn-primary" onclick="openMcqModal()">+ નવો MCQ ઉમેરો</button>
            <button class="btn-secondary" onclick="generateAutoQuiz()">⚡ Auto Quiz Maker</button>
          </div>
          <div class="box-title">📝 સ્વ-મૂલ્યાંકન MCQ ટેસ્ટ (${allMcqs.length} પ્રશ્નો)</div>
      `;

      allMcqs.forEach((mcq, qIdx) => {
        html += `
          <div class="quiz-card" id="quizCard_${qIdx}">
            <div class="quiz-q">${qIdx + 1}. ${mcq.q}</div>
            <div class="quiz-options">
              ${mcq.opts.map((opt, oIdx) => `
                <button class="quiz-opt-btn" onclick="handleSelectQuizOption(${qIdx}, ${oIdx})">
                  ${String.fromCharCode(65 + oIdx)}. ${opt}
                </button>
              `).join('')}
            </div>
            <div class="quiz-feedback" id="feedback_${qIdx}"></div>
          </div>
        `;
      });

      html += `</div>`;
      area.innerHTML = html;
    }

    function handleSelectQuizOption(qIdx, selectedIdx) {
      const mcq = APP_STATE.activeQuizMcqs ? APP_STATE.activeQuizMcqs[qIdx] : null;
      if (!mcq) return;

      const card = document.getElementById(`quizCard_${qIdx}`);
      if (!card) return;
      const buttons = card.querySelectorAll('.quiz-opt-btn');
      const feedback = document.getElementById(`feedback_${qIdx}`);
      const correctIdx = mcq.ans;

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === correctIdx) {
          btn.classList.add('correct');
        }
        if (idx === selectedIdx && selectedIdx !== correctIdx) {
          btn.classList.add('wrong');
        }
      });

      feedback.classList.add('show');
      const expHtml = mcq.exp ? `<br><small style="color:#94a3b8; margin-top:4px; display:block;">💡 સમજૂતી: ${mcq.exp}</small>` : '';

      if (selectedIdx === correctIdx) {
        feedback.style.background = 'rgba(16, 185, 129, 0.15)';
        feedback.style.color = '#6ee7b7';
        feedback.innerHTML = `✓ સાચો જવાબ! ${expHtml}`;
      } else {
        feedback.style.background = 'rgba(244, 63, 94, 0.15)';
        feedback.style.color = '#fda4af';
        feedback.innerHTML = `✗ ખોટો જવાબ! સાચો વિકલ્પ: <b>${String.fromCharCode(65 + correctIdx)}. ${mcq.opts[correctIdx]}</b> ${expHtml}`;
      }
    }

    // Alias for compatibility
    function checkAnswer(qIdx, selectedIdx) {
      handleSelectQuizOption(qIdx, selectedIdx);
    }

    function generateAutoQuiz() {
      const item = APP_STATE.activeItem;
      const customList = APP_STATE.userCustomMcqs[item.id] || [];
      const allMcqs = [...item.mcqs, ...customList];

      for (let i = allMcqs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allMcqs[i], allMcqs[j]] = [allMcqs[j], allMcqs[i]];
      }

      APP_STATE.activeQuizMcqs = allMcqs;
      const area = document.getElementById('tabContentArea');
      let html = `
        <div class="content-box">
          <div class="quiz-tools">
            <button class="btn-primary" onclick="openMcqModal()">+ નવો MCQ ઉમેરો</button>
            <button class="btn-secondary" onclick="renderMcqSection()">🔄 મૂળ ટેસ્ટ પર પાછા જાઓ</button>
          </div>
          <div class="box-title" style="color:#10b981;">⚡ Auto Quiz Mode સક્રિય થયો (રેન્ડમ ક્રમ)</div>
      `;

      allMcqs.forEach((mcq, qIdx) => {
        html += `
          <div class="quiz-card" id="quizCard_${qIdx}">
            <div class="quiz-q">${qIdx + 1}. ${mcq.q}</div>
            <div class="quiz-options">
              ${mcq.opts.map((opt, oIdx) => `
                <button class="quiz-opt-btn" onclick="handleSelectQuizOption(${qIdx}, ${oIdx})">
                  ${String.fromCharCode(65 + oIdx)}. ${opt}
                </button>
              `).join('')}
            </div>
            <div class="quiz-feedback" id="feedback_${qIdx}"></div>
          </div>
        `;
      });

      html += `</div>`;
      area.innerHTML = html;
    }

    function openMcqModal() {
      document.getElementById('addMcqModal').classList.remove('hidden');
    }

    function closeMcqModal() {
      document.getElementById('addMcqModal').classList.add('hidden');
      document.getElementById('customMcqForm').reset();
    }

    function saveCustomMcq(event) {
      event.preventDefault();
      const itemId = APP_STATE.activeItem.id;
      const q = document.getElementById('mcqQuestion').value.trim();
      const optA = document.getElementById('mcqOptA').value.trim();
      const optB = document.getElementById('mcqOptB').value.trim();
      const optC = document.getElementById('mcqOptC').value.trim();
      const optD = document.getElementById('mcqOptD').value.trim();
      const ans = parseInt(document.getElementById('mcqCorrectAnswer').value, 10);
      const exp = document.getElementById('mcqExplanation').value.trim();

      const newMcq = { q, opts: [optA, optB, optC, optD], ans, exp };

      if (!APP_STATE.userCustomMcqs[itemId]) {
        APP_STATE.userCustomMcqs[itemId] = [];
      }
      APP_STATE.userCustomMcqs[itemId].push(newMcq);
      localStorage.setItem('gseb10_custom_mcq', JSON.stringify(APP_STATE.userCustomMcqs));

      closeMcqModal();
      renderMcqSection();
    }

    function toggleFontSize() {
      APP_STATE.fontSizeLarge = !APP_STATE.fontSizeLarge;
      document.getElementById('appViewport').classList.toggle('font-lg', APP_STATE.fontSizeLarge);
    }
  </script>
</body>
</html>
